<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try HTML and CSS</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><a class="logo" href="index.html">HTML + CSS</a><nav><a href="html.html">HTML</a><a href="css.html">CSS</a><a href="test.html">Try it</a></nav></header>
  <main class="lesson">
    <p class="label">PRACTICE</p>
    <h1>Try your code.</h1>
    <p>Change the text or color, then press <strong>Show my page</strong>.</p>
    <label for="html-code">HTML</label>
    <textarea id="html-code" rows="6"><h1>Hello!</h1>
<p>I made this page.</p></textarea>
    <label for="css-code">CSS</label>
    <textarea id="css-code" rows="6">body { font-family: Arial; padding: 20px; }
h1 { color: green; }</textarea>
    <button class="button" id="show-page" type="button">Show my page</button>
    <h2>Your result</h2>
    <iframe id="preview" title="Your page preview" sandbox=""></iframe>
  </main>
  <footer><a href="index.html">← Home</a></footer>
</body>
</html>
